<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
  <meta content="mobile_blank" name="shell-type"/>
  <title>BloodConnect - Splash</title>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap" rel="stylesheet"/>
  <style>
    @layer base {
      html, body { width: 100vw; margin: 0; padding: 0; }
      body { overscroll-behavior: none; }
      .pb-safe { padding-bottom: env(safe-area-inset-bottom, 0px); }
      .pt-safe { padding-top: env(safe-area-inset-top, 0px); }
      main > :first-child { margin-top: 0 !important; }
      main > :last-child { margin-bottom: 0 !important; }
    }
    ::-webkit-scrollbar { display: none; }
  </style>
  <script src="https://cdn.tailwindcss.com"></script>
  <script id="tailwind-config">
    tailwind.config = {
      darkMode: "class",
      theme: {
        extend: {
          colors: {
            "primary-fixed": "#ffdad6",
            "on-tertiary-fixed": "#002113",
            "primary-container": "#db322f",
            "on-secondary-fixed": "#1a1c1c",
            "secondary-fixed-dim": "#c6c6c7",
            "tertiary-fixed": "#6ffbbe",
            "on-secondary-fixed-variant": "#454747",
            "surface-container-high": "#dee8ff",
            "tertiary": "#006947",
            "surface-container-highest": "#d8e3fb",
            "inverse-primary": "#ffb4ac",
            "tertiary-fixed-dim": "#4edea3",
            "on-surface-variant": "#5b403d",
            "secondary-fixed": "#e2e2e2",
            "primary": "#b7131a",
            "on-secondary": "#ffffff",
            "surface": "#f9f9ff",
            "surface-variant": "#d8e3fb",
            "surface-tint": "#bb171c",
            "on-secondary-container": "#616363",
            "on-error-container": "#93000a",
            "on-background": "#111c2d",
            "inverse-surface": "#263143",
            "outline-variant": "#e4beb9",
            "on-tertiary-fixed-variant": "#005236",
            "on-tertiary": "#ffffff",
            "on-tertiary-container": "#f5fff6",
            "secondary-container": "#dfe0e0",
            "background": "#f9f9ff",
            "on-primary": "#ffffff",
            "surface-dim": "#cfdaf2",
            "on-primary-fixed-variant": "#93000d",
            "surface-container": "#e7eeff",
            "inverse-on-surface": "#ecf1ff",
            "primary-fixed-dim": "#ffb4ac",
            "on-error": "#ffffff",
            "surface-container-lowest": "#ffffff",
            "tertiary-container": "#00855b",
            "surface-container-low": "#f0f3ff",
            "surface-bright": "#f9f9ff",
            "on-surface": "#111c2d",
            "secondary": "#5d5f5f",
            "on-primary-fixed": "#410002",
            "error-container": "#ffdad6",
            "on-primary-container": "#fffbff",
            "error": "#ba1a1a",
            "outline": "#906f6c"
          },
          borderRadius: {
            "DEFAULT": "0.25rem",
            "lg": "0.5rem",
            "xl": "0.75rem",
            "full": "9999px"
          },
          spacing: {
            "margin": "1rem",
            "gutter-desktop": "1.5rem",
            "space-md": "1rem",
            "space-xs": "0.25rem",
            "space-lg": "1.5rem",
            "margin-desktop": "2.5rem",
            "space-xl": "2rem",
            "space-sm": "0.5rem",
            "gutter": "1rem"
          },
          fontFamily: {
            "headline-md": ["Inter"],
            "headline-lg": ["Inter"],
            "body-sm": ["Inter"],
            "label-sm": ["Inter"],
            "headline-sm": ["Inter"],
            "display-lg": ["Inter"],
            "label-lg": ["Inter"],
            "body-md": ["Inter"],
            "display-lg-mobile": ["Inter"],
            "label-md": ["Inter"],
            "body-lg": ["Inter"]
          },
          fontSize: {
            "headline-md": ["22px", { lineHeight: "28px", letterSpacing: "-0.01em", fontWeight: "600" }],
            "headline-lg": ["28px", { lineHeight: "36px", letterSpacing: "-0.015em", fontWeight: "700" }],
            "body-sm": ["12px", { lineHeight: "16px", fontWeight: "400" }],
            "label-sm": ["10px", { lineHeight: "12px", letterSpacing: "0.04em", fontWeight: "700" }],
            "headline-sm": ["18px", { lineHeight: "24px", fontWeight: "600" }],
            "display-lg": ["40px", { lineHeight: "48px", letterSpacing: "-0.02em", fontWeight: "800" }],
            "label-lg": ["14px", { lineHeight: "20px", letterSpacing: "0.01em", fontWeight: "600" }],
            "body-md": ["14px", { lineHeight: "20px", fontWeight: "400" }],
            "display-lg-mobile": ["32px", { lineHeight: "40px", letterSpacing: "-0.02em", fontWeight: "800" }],
            "label-md": ["12px", { lineHeight: "16px", letterSpacing: "0.02em", fontWeight: "600" }],
            "body-lg": ["16px", { lineHeight: "24px", fontWeight: "400" }]
          }
        }
      }
    };
  </script>
</head>
<body class="bg-surface font-body-md text-on-surface antialiased pt-safe pb-safe min-h-screen flex flex-col cursor-pointer" onclick="window.location.href='2-onboarding.html'">
  <main class="flex flex-col relative w-full bg-surface min-h-screen">
    <div class="flex flex-col w-full relative overflow-hidden select-none">
      <!-- Subtle ambient radial aura behind brand core -->
      <div class="absolute inset-0 pointer-events-none flex items-center justify-center -z-10">
        <div class="w-80 h-80 rounded-full bg-primary-fixed/35 blur-3xl transform scale-110"></div>
        <div class="w-48 h-48 rounded-full bg-primary/10 blur-2xl"></div>
      </div>
      <!-- Decorative subtle background lifeline grid motif -->
      <div class="absolute inset-0 pointer-events-none opacity-[0.035] -z-10 flex items-center justify-center">
        <svg class="w-full h-full text-primary" fill="none" viewbox="0 0 400 800" xmlns="http://www.w3.org/2000/svg">
          <path d="M-50 400 H120 L135 370 L150 430 L168 350 L185 440 L200 390 L212 410 L225 400 H450" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5"></path>
          <circle cx="200" cy="400" r="180" stroke="currentColor" stroke-dasharray="4 8" stroke-width="1.5"></circle>
        </svg>
      </div>

      <!-- Main Centered Splash Container -->
      <div class="flex flex-col items-center justify-between px-margin py-space-xl min-h-[580px] w-full max-w-sm mx-auto">
        <!-- Top System Verification Pill -->
        <div class="flex items-center gap-space-xs px-3.5 py-1.5 rounded-full bg-surface-container-low shadow-sm transition-all duration-300">
          <span class="relative flex h-2 w-2">
            <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-tertiary-container opacity-75"></span>
            <span class="relative inline-flex rounded-full h-2 w-2 bg-tertiary"></span>
          </span>
          <span class="font-label-sm text-label-sm uppercase text-tertiary tracking-wider font-semibold">Clinical Network Live</span>
        </div>

        <!-- Central Hero & Brand Lockup -->
        <div class="flex flex-col items-center text-center my-auto w-full">
          <!-- Logo Container with Soft Shadow & Pulsing Radiance -->
          <div class="relative flex items-center justify-center mb-space-lg">
            <div class="absolute inset-0 rounded-2xl bg-primary/15 blur-xl scale-95 animate-pulse"></div>
            <div class="relative w-28 h-28 rounded-2xl bg-surface-container-lowest shadow-xl flex items-center justify-center p-3 transform transition-transform hover:scale-105 duration-300">
              <img alt="BloodConnect Brand Logo" class="w-full h-full object-contain rounded-xl drop-shadow-sm" src="https://lh3.googleusercontent.com/aida/ALJJyrBzo5vb3IUJ9bLqQMvAUndVNKcSe0ksycOKadzzg7QbMNgPsGwuLvIDTxD-PKfMyK5hOOB1P5l5xHCOHFvLNSlQAzqGI6tcMphy2J31qs0Aj3qEsH45woG1TBgTrw7E64bBtExaa-L88FIu0iDIFFEI4r23EggUVsycRC1kBUg0liLSSud66zdA4WcEPrjUJ7S6wjmKW48jNacJ4NIUWmWLNoQnqxy39UVY5lGJajne"/>
            </div>
          </div>
          <!-- App Title -->
          <h1 class="font-headline-lg text-headline-lg text-on-surface tracking-tight font-extrabold flex items-center justify-center gap-0.5">
            <span>Blood</span><span class="text-primary">Connect</span>
          </h1>
          <!-- Tagline & Animated Heartbeat Pulse Track -->
          <div class="flex flex-col items-center mt-space-xs space-y-1.5">
            <p class="font-body-md text-body-md text-on-surface-variant font-medium">
              Every Drop Saves a Life
            </p>
            <!-- Dynamic Medical ECG Pulse Waveform -->
            <div class="w-44 h-7 flex items-center justify-center text-primary relative">
              <svg class="w-full h-full" fill="none" viewbox="0 0 160 28" xmlns="http://www.w3.org/2000/svg">
                <path class="opacity-30" d="M0 14 H40 L48 14 L53 5 L59 23 L65 3 L71 25 L76 11 L81 16 L86 14 H160" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2"></path>
                <path d="M0 14 H40 L48 14 L53 5 L59 23 L65 3 L71 25 L76 11 L81 16 L86 14 H160" id="pulse-wave" stroke="currentColor" stroke-dasharray="160" stroke-dashoffset="160" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.2">
                  <animate attributename="stroke-dashoffset" dur="2.4s" ease="linear" repeatcount="indefinite" values="160;0"></animate>
                </path>
              </svg>
            </div>
          </div>

          <!-- Live Donor Readiness Capsule -->
          <div class="mt-space-md w-full max-w-xs bg-surface-container-lowest rounded-xl shadow-md p-space-sm flex items-center justify-between">
            <div class="flex items-center gap-space-xs">
              <div class="w-8 h-8 rounded-lg bg-primary-fixed flex items-center justify-center text-primary">
                <span class="material-symbols-outlined text-[18px]" style="font-variation-settings: 'FILL' 1;">favorite</span>
              </div>
              <div class="text-left">
                <p class="font-label-sm text-label-sm text-on-surface-variant uppercase">Emergency Readiness</p>
                <p class="font-label-md text-label-md text-on-surface font-semibold">14,280+ Verified Donors</p>
              </div>
            </div>
            <div class="flex items-center gap-1 bg-surface-container px-2 py-1 rounded-md">
              <span class="material-symbols-outlined text-[14px] text-primary">sensors</span>
              <span class="font-label-sm text-label-sm text-primary font-bold">READY</span>
            </div>
          </div>
        </div>

        <!-- Bottom Progress & Clinical Dispatch Status -->
        <div class="w-full flex flex-col items-center space-y-space-sm pt-space-lg">
          <!-- Sleek Dynamic Micro Progress Track -->
          <div class="w-44 h-1.5 bg-surface-container-highest rounded-full overflow-hidden relative">
            <div class="h-full bg-primary rounded-full w-1/3 transition-all duration-700 ease-out" id="splash-progress"></div>
          </div>
          <!-- System Micro Status -->
          <div class="flex items-center justify-center gap-1.5">
            <span class="material-symbols-outlined text-[14px] text-on-surface-variant animate-spin">sync</span>
            <p class="font-label-sm text-label-sm text-on-surface-variant" id="status-text">Connecting to regional dispatch...</p>
          </div>
          <!-- Trust Assurance Badge -->
          <div class="flex items-center gap-1 opacity-70">
            <span class="material-symbols-outlined text-[12px] text-secondary">verified_user</span>
            <span class="font-label-sm text-label-sm text-secondary">HIPAA & Clinical Protocol Compliant</span>
          </div>
          <div class="text-[11px] text-primary font-medium mt-1 animate-pulse">
            Tap anywhere to continue &rarr;
          </div>
        </div>
      </div>

      <script>
        (function() {
          const messages = [
            "Connecting to regional dispatch...",
            "Syncing compatible blood reserves...",
            "Locating standby donors nearby...",
            "Network ready. Saving lives."
          ];
          let step = 0;
          const textElem = document.getElementById("status-text");
          const barElem = document.getElementById("splash-progress");

          const interval = setInterval(() => {
            step++;
            if (step >= messages.length) {
              clearInterval(interval);
              setTimeout(() => {
                window.location.href = "2-onboarding.html";
              }, 600);
              return;
            }
            if (textElem) textElem.textContent = messages[step];
            if (barElem) {
              const widths = ["35%", "65%", "88%", "100%"];
              barElem.style.width = widths[step];
            }
          }, 1000);
        })();
      </script>
    </div>
  </main>
</body>
</html>
